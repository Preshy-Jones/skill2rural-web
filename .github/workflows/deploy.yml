name: CI/CD for NestJS

on:
  push:
    branches:
      - staging # Trigger on pushes to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install Node.js and dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          npm install
          npm run build

      # Step 3: Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          script: |
            cd skill2rural-web
            git pull origin staging
            npm install
            npm run build

            # Create logs directory if it doesn't exist
            mkdir -p logs

            # Stop and delete existing processes to prevent duplicates
            pm2 stop skill2rural-web || true
            pm2 delete skill2rural-web || true

            # Start fresh process using ecosystem config
            pm2 start ecosystem.config.js

            # Save PM2 configuration
            pm2 save

            # Show status for verification
            pm2 status
